<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Suhail Viewer" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>
      Suhail Viewer - Professional Document & Database Viewer for PDF, Excel,
      Word, Access, SQLite, RTF, Markdown & Images
    </title>
    <meta
      name="description"
      content="High-performance local viewer for PDF, Excel (XLS/XLSX), Word (DOC/DOCX), Access databases (MDB/ACCDB), SQLite databases (DB/SQLite3), RTF, Markdown, and Images. Secure, offline-first workstation with Zen Mode and multi-tab support."
    />
    <meta name="theme-color" content="#7c3aed" />
    <link rel="manifest" href="/manifest.json" />
    <link
      rel="icon"
      type="image/png"
      href="https://cdn-icons-png.flaticon.com/512/281/281760.png"
    />
    <link
      rel="apple-touch-icon"
      href="https://cdn-icons-png.flaticon.com/512/281/281760.png"
    />

    <!-- IE Compatibility -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Core Engine Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- Office Parsers -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docx-preview@0.1.15/dist/docx-preview.js"></script>
    <script src="https://unpkg.com/rtf.js/dist/RTFJS.bundle.js"></script>

    <!-- PDF & Text Parsers -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica,
          Arial, sans-serif;
      }
      #root {
        height: 100vh;
        width: 100vw;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #e4e4e7;
        border-radius: 10px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #3f3f46;
      }
      .zen-mode .hide-in-zen {
        display: none !important;
      }

      .textLayer {
        opacity: 1;
        mix-blend-mode: multiply;
      }
      .dark .textLayer {
        mix-blend-mode: screen;
        filter: invert(1);
      }

      * {
        transition-property:
          background-color, border-color, color, fill, stroke;
        transition-duration: 150ms;
      }

      @media print {
        header,
        aside,
        .hide-in-print,
        nav,
        .dropzone-overlay,
        .tab-bar-container {
          display: none !important;
        }
        main,
        #root,
        body {
          height: auto !important;
          overflow: visible !important;
          width: 100% !important;
          background: white !important;
        }
      }

      .dropzone-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: rgba(124, 58, 237, 0.1);
        backdrop-filter: blur(12px);
        border: 4px dashed #7c3aed;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      .dropzone-active .dropzone-overlay {
        display: flex;
      }

      .docx-wrapper {
        background: transparent !important;
        padding: 0 !important;
      }
      .docx-inner {
        box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.15) !important;
        margin-bottom: 2rem !important;
      }
      .tab-bar-container {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      #initial-loader {
        position: fixed;
        inset: 0;
        background: #09090b;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        font-family: sans-serif;
      }

      /* IE Warning Styles */
      #ie-warning {
        position: fixed;
        inset: 0;
        z-index: 10001;
        background: white;
        color: black;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
        font-family: Arial, sans-serif;
      }

      #ie-warning.hidden {
        display: none;
      }

      #ie-warning h1 {
        font-size: 2rem;
        margin-bottom: 1rem;
        color: #dc2626;
      }

      #ie-warning p {
        font-size: 1.25rem;
        line-height: 1.6;
        margin-bottom: 2rem;
        max-width: 600px;
      }

      #ie-warning .browser-list {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1rem;
        margin-bottom: 2rem;
      }

      #ie-warning .browser-item {
        padding: 0.75rem 1.5rem;
        background: #f3f4f6;
        border-radius: 0.5rem;
        font-weight: bold;
      }

      #ie-warning .dismiss {
        padding: 0.75rem 2rem;
        background: #3b82f6;
        color: white;
        border: none;
        border-radius: 0.5rem;
        font-size: 1.125rem;
        cursor: pointer;
      }

      #ie-warning .dismiss:hover {
        background: #2563eb;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.0.0",
          "react-dom": "https://esm.sh/react-dom@19.0.0",
          "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
          "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
          "react/": "https://esm.sh/react@^19.2.4/"
        }
      }
    </script>
  </head>
  <body
    class="bg-zinc-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 transition-colors duration-300"
  >
    <!-- Theme initialization script - runs before React to prevent flash -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('suhail_theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <!-- IE Warning -->
    <div id="ie-warning">
      <h1>Internet Explorer Not Supported</h1>
      <p>
        This application requires a modern web browser. Internet Explorer is no
        longer supported and may cause performance issues or failures.
      </p>
      <div class="browser-list">
        <div class="browser-item">Chrome</div>
        <div class="browser-item">Firefox</div>
        <div class="browser-item">Safari</div>
        <div class="browser-item">Edge</div>
      </div>
      <button
        class="dismiss"
        onclick="document.getElementById('ie-warning').classList.add('hidden')"
      >
        Continue Anyway
      </button>
    </div>

    <div id="initial-loader">
      <div
        style="
          width: 48px;
          height: 48px;
          border: 4px solid #7c3aed;
          border-top-color: transparent;
          border-radius: 50%;
          animation: spin 1s linear infinite;
          margin-bottom: 20px;
        "
      ></div>
      <div style="font-weight: 900; letter-spacing: -0.05em; font-size: 24px">
        SUHAIL <span style="color: #7c3aed">VIEWER</span>
      </div>
      <div
        style="
          font-size: 10px;
          font-weight: bold;
          margin-top: 8px;
          opacity: 0.5;
          text-transform: uppercase;
          letter-spacing: 0.2em;
        "
      >
        Initializing workstation...
      </div>
      <style>
        @keyframes spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
    </div>

    <div id="root"></div>

    <!-- IE Detection -->
    <script>
      (function () {
        var isIE = false;
        try {
          isIE =
            navigator.userAgent.indexOf('MSIE') !== -1 ||
            !!document.documentMode;
        } catch (e) {
          // Fallback to feature detection if userAgent fails
          isIE = !!(document.all && !window.atob);
        }

        if (isIE) {
          console.warn(
            'Internet Explorer detected; some features may not work correctly'
          );
        } else {
          document.getElementById('ie-warning').classList.add('hidden');
        }
      })();
    </script>

    <!-- IE11 Polyfills -->
    <!--[if IE 11]>
      <script src="https://cdn.jsdelivr.net/npm/core-js@3.28.0/minified.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/regenerator-runtime@0.13.11/runtime.min.js"></script>
    <![endif]-->

    <!-- Application Entry Point -->
    <script type="module" src="index.tsx"></script>

    <script>
      // Clean up loader once React mounts
      const observer = new MutationObserver((mutations) => {
        if (document.getElementById('root')?.children.length > 0) {
          const loader = document.getElementById('initial-loader');
          if (loader) loader.style.display = 'none';
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('root'), { childList: true });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .then((reg) => console.log('ServiceWorker registered:', reg.scope))
            .catch((err) => {
              console.warn('ServiceWorker registration skipped:', err.message);
            });
        });
      }
    </script>
  </body>
</html>
