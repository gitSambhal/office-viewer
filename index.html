
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suhail Office Viewer</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
              colors: {
                zinc: {
                  950: '#09090b',
                },
                violet: {
                  600: '#7c3aed',
                }
              }
            }
          }
        }
    </script>
    <!-- Core Engine Dependencies (JSZip MUST be first for docx-preview) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    
    <!-- Office Parsers -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docx-preview@0.1.15/dist/docx-preview.js"></script>
    <script src="https://unpkg.com/rtf.js/dist/RTFJS.bundle.js"></script>
    
    <!-- PDF & Text Parsers -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
        #root { height: 100vh; width: 100vw; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e4e4e7; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #3f3f46; }
        .zen-mode .hide-in-zen { display: none !important; }
        .textLayer { opacity: 1; mix-blend-mode: multiply; }
        .dark .textLayer { mix-blend-mode: screen; filter: invert(1); }
        * { transition-property: background-color, border-color, color, fill, stroke; transition-duration: 200ms; }
        
        @media print {
            header, aside, .hide-in-print, nav, .dropzone-overlay, .tab-bar-container { display: none !important; }
            main, #root, body { height: auto !important; overflow: visible !important; width: 100% !important; background: white !important; }
            .docx-preview-container, .pdf-container, .spreadsheet-container { padding: 0 !important; margin: 0 !important; box-shadow: none !important; border: none !important; }
        }

        .dropzone-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(124, 58, 237, 0.1);
            backdrop-filter: blur(12px);
            border: 4px dashed #7c3aed;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .dropzone-active .dropzone-overlay {
            display: flex;
        }
        
        /* docx-preview style overrides */
        .docx-wrapper {
            background: transparent !important;
            padding: 0 !important;
        }
        .docx-inner {
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.15) !important;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
</head>
<body class="bg-zinc-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 transition-colors duration-300">
    <div id="root"></div>
</body>
</html>
